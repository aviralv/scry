name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          # Hash both lockfiles — `web/` is a separate workspace, and
          # the default cache key would miss web-only dependency churn.
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - run: npm ci
      - run: cd web && npm ci
      - name: Backend tests
        run: npm test
      - name: Web tests
        run: cd web && npm test
      - name: Typecheck server (production)
        run: npx tsc --noEmit
      - name: Typecheck server (incl. tests)
        # Verifies test files still type-check even though they're
        # excluded from the published tarball. Catches type drift in
        # tests during refactors.
        run: npx tsc -p tsconfig.spec.json --noEmit
      - name: Typecheck web
        run: cd web && npx tsc -b
      - name: Build (server + web)
        run: npm run build
      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: scry-dist
          path: dist
          retention-days: 1

  e2e:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - run: npm ci
      - run: cd web && npm ci
      - name: Download dist from unit job
        uses: actions/download-artifact@v4
        with:
          name: scry-dist
          path: dist
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          # Re-key on the Playwright version so cache invalidates on
          # version bumps without manual intervention.
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run E2E
        run: npm run test:e2e
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
